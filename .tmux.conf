# tmux 3.x 向け設定

# reload tmux config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

################
## key command
# C-bのキーバインドを解除する
unbind C-b
# prefixキーをC-aに変更する
set -g prefix C-a
# | でペインを左右に分割する, - でペインを上下に分割する
bind | split-window -h
bind - split-window -v

# 256色端末を使用する
set -g default-terminal "screen-256color"

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
# Prefix+H,J,K,L 連打でサイズ変更
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

################
## status bar
# begin index of window from 1
set -g base-index 1

## window-status を中央揃えで配置
set -g status-justify centre
## ステータスバーの色
set -g status-style "fg=white,bg=black"
## set the left panel
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
## set the right panel
set -g status-right-length 100
# display the status bar at the top
set -g status-position top
# Contents right
set -g status-right '#[fg=white]#(wifi)#[default] #(battery --tmux) [%Y-%m-%d(%a) %H:%M]'

## window
# set the color of window list
setw -g window-status-style "fg=cyan,bg=default,dim"
# hightlight the active window
setw -g window-status-current-style "fg=white,bg=red,bold"

## pane
# begin index of pane from 1
setw -g pane-base-index 1
# set the color of the pane border
set -g pane-border-style "fg=green,bg=black"
# hightlight the active pane
set -g pane-active-border-style "fg=white,bg=yellow"

## others
# enable the mouse operation
set -g mouse on
## enable the visual notification
setw -g monitor-activity on
set -g visual-activity on

